name: PR Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  artifact-guard:
    name: artifact-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if [[ -z "$changed_files" ]]; then
            echo "No changed files detected."
            exit 0
          fi

          disallowed='(^|/)(\.build/|build/DerivedData/|DerivedData/|xcuserdata/)|(^|/).*\.xcuserstate$'
          violations="$(echo "$changed_files" | grep -E "$disallowed" || true)"
          if [[ -n "$violations" ]]; then
            echo "Disallowed build artifacts detected in PR:" >&2
            echo "$violations" >&2
            exit 1
          fi

          echo "Changed files passed artifact guard."

  build-and-test:
    name: build-and-test
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: |
          set -euo pipefail
          swift build 2>&1 | tee build.log

      - name: Test
        run: |
          set -euo pipefail
          swift test 2>&1 | tee test.log

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-gate-logs-${{ github.run_id }}
          path: |
            build.log
            test.log
          if-no-files-found: error